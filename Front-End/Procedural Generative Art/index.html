<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Art Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="controls">
            <h2>Generative Art</h2>
            <p class="subtitle">Recursive Fractal Trees</p>

            <div class="control-group">
                <label for="depth">Complexity (Depth): <span id="depth-val">10</span></label>
                <input type="range" id="depth" min="1" max="12" value="10">
            </div>

            <div class="control-group">
                <label for="angle">Branch Angle: <span id="angle-val">20</span>°</label>
                <input type="range" id="angle" min="5" max="90" value="20">
            </div>

            <div class="control-group">
                <label for="length">Trunk Length: <span id="length-val">120</span></label>
                <input type="range" id="length" min="50" max="250" value="120">
            </div>

            <div class="control-group">
                <label for="color">Foliage Color:</label>
                <input type="color" id="color" value="#00ffcc">
            </div>

            <div class="button-group">
                <button id="btn-random">Generate Random</button>
                <button id="btn-download">Export to PNG</button>
            </div>
        </aside>

        <main class="canvas-container">
            <canvas id="art-canvas"></canvas>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
