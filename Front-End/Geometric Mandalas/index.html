<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Mandala Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="controls">
        <h2>Mandala Creator</h2>
        <p class="subtitle">Procedural Art Generator</p>

        <div class="control-group">
            <label for="sides">Symmetry (Sides): <span id="sides-val">12</span></label>
            <input type="range" id="sides" min="4" max="36" value="12">
        </div>

        <div class="control-group">
            <label for="layers">Complexity (Layers): <span id="layers-val">8</span></label>
            <input type="range" id="layers" min="2" max="20" value="8">
        </div>

        <div class="control-group">
            <label for="radius">Spread (Radius): <span id="radius-val">250</span></label>
            <input type="range" id="radius" min="50" max="500" value="250">
        </div>

        <div class="control-group">
            <label for="color">Primary Color:</label>
            <input type="color" id="color" value="#00ffcc">
        </div>

        <div class="control-group">
            <label for="bgColor">Background Color:</label>
            <input type="color" id="bgColor" value="#121212">
        </div>

        <div class="button-group">
            <button id="btn-random" class="btn secondary">Generate Random</button>
            <button id="btn-export" class="btn primary">Export to PNG</button>
        </div>
    </aside>

    <main class="canvas-container">
        <canvas id="artCanvas"></canvas>
    </main>

    <script src="script.js"></script>
</body>
</html>
